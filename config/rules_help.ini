[Vars_Help]
harvestUnloadDelay=Number of ticks before another blob is subtracted from the Harvester's load while docked at a Refinery.
harvestBlobValue=Value of each blob of Spice. This does not change the maximum storage capacity of Silos or Refineries.
harvestLoadSpiceDelay=Number of ticks before another blob can be added to a Harvester's load while it's mining resources.
starportUpdateDelay=Number of ticks between randomization of Starport stock.
starportStockIncreaseDelay=Number of ticks between possible increases in Starport stock.
starportStockIncreaseProb=Probability that the stock of a given unit will increase at the Starport.
starportCostVariationPercent=The maximum variation in units' cost beneath its regular value each time the Starport updates. This value cannot be negative.
starportFrigateDelay=Number of ticks before a Starport delivery arrives.
refineryExplosionOffsetX=Special X offset of Refinery processing effect each time a blob is added to storage.
refineryExplosionOffsetY=Special Y offset of Refinery processing effect each time a blob is added to storage.
HarvesterDriveDistance=The square root of this value is the number of tiles a Harvester can be asked to drive before a Carryall, if it exists, will attempt to airlift it.
RepairDriveDistance=The square root of this value is the number of tiles a vehicle ordered to repair can be asked to drive before a Carryall, if it exists, will attempt to airlift it.
BuildingRepairValue=The amount of hit points repaired each time a credit is spent on repairing. Changing this value also changes the speed at which buildings will be repaired.
UnitRepairValue=The amount of hit points repaired each time a credit is spent on repairing. Changing this value also changes the speed at which units will be repaired.
SinglePlayerDelay=UNKNOWN
NumberOfFremen=The amount of Fremen spawned by the completion of a unit with the Fremen behavior. If the unit is infantry, this value cannot be set higher than 5. If the unit is a vehicle, the value must be 1. If set to 0, nothing will spawn.
SandWormAppetite=The number of vehicles a sandworm will devour before going to sleep on its own.
SandWormInitialSleep=The amount of time (in ticks times 100) before sandworms will first appear on the map.
SandWormFedSleep=The amount of time (in ticks times 100) sandworms will sleep after feasting on enough vehicles.
SandWormShotSleep=The amount of time (in ticks times 100) sandworms will sleep after being subdued by weapons.
NumberOfCrates=The amount of crates that can spawn on the map at once in a multiplayer game.
CratesPerPlayer=If enabled, the NumberOfCrates will be multiplied by the number of players in a multiplayer game.
DevastatorExplodeDelay=Time in ticks before a unit with the Devastator's self-destruct behavior explodes.
IgnoreDistance=UNKNOWN
CrateCash=The amount of cash rewarded for picking up a default cash crate.
ShowWarnings=UNKNOWN
DeathHandAccuracy=The random offset in tiles of a Death Hand Missile from its targeted location. The minimum value is 1.
InfiniteSpice=Prevents thick Spice tiles from being depleted. Thin Spice tiles will still be harvested normally.
infantryReleaseLimit=The maximum amount of infantry allowed to spawn from a sold or destroyed structure. Although the number of infantry that should spawn is determined by the formula, num_infantry_to_release = building_cost / 3 / unit_cost, the maximum is also limited to however many tiles a structure occupies. Only one infantry unit will spawn per tile.
infantryReleaseChance=The chance that an infantry unit spawns from a structure. The value should range between 1-10, with a higher value having a higher chance of spawning a unit.
buildingsAlwaysNeedPrerequisites=If set to Yes, losing a prerequisite for a building will remove that building from the sidebar, just like how losing a prerequisite for a unit works.
returnCreditsToSpiceStorage=By default, building and then canceling a unit or structure, or choosing units at the Starport and then unchoosing them, will consume Spice from your storage and refund credits that don't need to go into storage. This is highly exploitable; the player never needs Silos or many Refineries as long as the player has a Starport to dump funds. If set to yes, this game rule will return funds to storage instead, preventing that exploit.
intervalsAreOffByOneTick=By default, intervals operate slightly differently from timers. An interval with a Start Delay and Next Delay of 1499 will coincide with a repeating timer of 1500 ticks. Set this rule to "No" to make intervals' and timers' values operate the same way.
guardModeRadius=The radius in pixels a unit will acquire hostile targets while set to guard mode.
alwaysShowRadar=If enabled, the minimap will be displayed regardless of power or the presence of an Outpost.
costPercentageEasy=The percentage of normal value things cost the player on easy difficulty. This does not apply to the AI.
costPercentageHard=The percentage of normal value things cost the player on hard difficulty. This does not apply to the AI.
buildSpeedPercentageEasy=The player's build speed on easy difficulty will be multiplied by this value. This does not apply to the AI.
buildSpeedPercentageHard=The player's build speed on hard difficulty will be multiplied by this value. This does not apply to the AI.
uncloakRemainingStealthUnit=By default, if a side has only stealthed units left on a map, one of them will wink out of stealth repeatedly. Disable this to allow stealthed units to remain stealthed, even if they are the only units belonging to a given faction left on the map.
maxChatMessages=The maximum amount of messages that can be listed in the default chat frame at once.
showNeutralBecomeHostileMsg=By default, when a neutral side becomes hostile, an automated message plays to alert the side that triggered hostilities. Disable this to prevent that message.
maxSameSoundsPlaying=The game will never play more than two of the same sound in the same tick, to reduce maximum volume. This rule determines how many of the same sounds can be played in a row, to diversify the limited sound channels.
buildQueuesEnabled=This game rule allows the player to queue units. Queues have no effect whatsoever on the AI.
buildQueuesMaxPerFactory=The maximum amount of units that can be queued at a given factory. This value caps at 100.
buildQueuesMaxPerUnitType=The maximum amount of units of the same type that can be queued at once. This value caps at 100.
buildQueuesBulkIncrement=The amount of units to add or remove from the queue when using the shift + click hotkey on the sidebar while queues are enabled.
buildQueuesInfinityEnabled=This game rule enables "infiniqueue," allowing the player to toggle infinite production of chosen units with the alt + click hotkey while queues are enabled.
showEnemyStructureNames=By default, enemy units and structures' names are not revealed to the player when they are moused over. Enable this to display names on moused-over enemies.
showNeutralStructureNames=By default, neutral units and structures' names are not revealed to the player when they are moused over. Enable this to display names on moused-over neutral entities.